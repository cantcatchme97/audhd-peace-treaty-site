.node{border-radius:14px;padding:9px 12px;font-size:13.5px;line-height:1.3;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--rule);transition:opacity .45s,transform .45s}

.node.dh{box-shadow:inset 0 0 0 1.5px var(--dh);background:var(--dh-s)}
.node.au{box-shadow:inset 0 0 0 1.5px var(--au);background:var(--au-s)}
.node.ok{box-shadow:inset 0 0 0 1.5px var(--ok);background:var(--ok-s)}
.node.ink{background:var(--ink);color:var(--paper);box-shadow:none}
.off{opacity:0;transform:translateY(8px)}
.dim{opacity:.25}
.arrow{width:2px;height:16px;background:var(--muted);margin:0 auto;position:relative;transition:opacity .4s}
.arrow::after{content:"";position:absolute;left:-4px;bottom:-2px;border:5px solid transparent;border-top:6px solid var(--muted);border-bottom:0}

/* laptop */
.laptop{display:flex;flex-direction:column;align-items:center;gap:0}
.screen{width:100%;max-width:330px;aspect-ratio:16/10;background:var(--ink);border-radius:14px 14px 4px 4px;padding:10px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;position:relative}
.screen .ttl{font:600 11px var(--fb);color:var(--paper);opacity:.7;display:flex;justify-content:space-between}
.wins{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.win{border:0;cursor:pointer;border-radius:8px;padding:8px;color:#fff;font:600 12px/1.3 var(--fb);text-align:left;display:flex;flex-direction:column;gap:4px;position:relative}
.win.au{background:#4A3A7A}.win.dh{background:#C8442A}
.win small{font-weight:400;opacity:.9;transition:opacity .4s}
.win .x{position:absolute;top:5px;right:7px;opacity:.7}
.jit{animation:jit .18s linear infinite}
@keyframes jit{25%{transform:translate(1px,-1px)}75%{transform:translate(-1px,1px)}}
.base{width:112%;max-width:370px;height:12px;background:var(--sheet2);border-radius:0 0 12px 12px;box-shadow:inset 0 1px 0 var(--rule)}
.res{width:100%;max-width:330px;margin-top:14px}
.res .lab{display:flex;justify-content:space-between;font:600 11px var(--fb);color:var(--muted);margin-bottom:5px}
.res .bar{height:12px;border-radius:6px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule);position:relative;overflow:hidden}
.res .bar i{position:absolute;top:0;bottom:0;transition:width 1s ease}
.res .bar .a{left:0;background:var(--au)}.res .bar .d{right:0;background:var(--dh)}
.fan{display:inline-block}.spin{animation:spin .5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--ink);color:var(--paper);font:500 13px var(--fb);padding:8px 14px;border-radius:999px;white-space:nowrap;transition:opacity .3s}

/* loop */
.loopsvg{width:100%;height:auto;display:block}
.loopsvg .n{transition:opacity .5s}
.dial{transition:transform .8s cubic-bezier(.3,1.5,.5,1);transform-box:fill-box;transform-origin:center}

/* desk */
.modes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.desk{position:relative;height:236px;border-radius:16px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule);margin-top:12px;overflow:hidden}
.desk .lbl{position:absolute;left:12px;bottom:10px;font:600 11px var(--fb);color:var(--muted)}
.desk .bin{position:absolute;right:10px;bottom:8px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.sig{position:absolute;left:0;top:0;white-space:nowrap;font:500 13px var(--fb);padding:6px 10px;border-radius:999px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--rule);transition:transform .7s cubic-bezier(.3,1.25,.5,1),opacity .5s,background .4s;will-change:transform}
.sig.hot{background:var(--dh-s);box-shadow:inset 0 0 0 1.5px var(--dh)}
.sig .num{font-weight:700;color:var(--ok);margin-right:4px}
.wob{animation:wob .9s ease-in-out infinite}
.outcome{margin-top:10px;text-align:center;font-size:14px;min-height:42px}

/* habituation */
.hab{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.hab .col{background:var(--paper);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 0 0 1px var(--rule)}
.hab .col h4{margin:0;font:600 12px var(--fb);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.hab .it{font-size:13.5px;transition:opacity .2s}
.load{height:8px;border-radius:4px;background:var(--rule);overflow:hidden;margin-top:4px}
.load i{display:block;height:100%;transition:width .2s,background .3s}
.hab .say{font-size:12.5px;color:var(--ink2);min-height:34px}
.rng{width:100%;accent-color:var(--dh)}
.rlab{display:flex;justify-content:space-between;font:600 12px var(--fb);color:var(--muted)}

/* bucket + window */
.bucket{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.water{transition:none}
.win2{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.wbar{position:relative;height:30px;border-radius:10px;overflow:hidden;display:flex;font:600 11px var(--fb)}
.wbar span{display:grid;place-items:center;text-align:center;line-height:1.1;padding:0 4px;color:#fff}
.wnt .u{background:#9C94A8;width:20%}.wnt .c{background:var(--ok);width:60%}.wnt .o{background:#9C94A8;width:20%}
.wad .u{background:var(--dh);width:44%}.wad .c{background:var(--ok);width:12%}.wad .o{background:#4A3A7A;width:44%}
.knob{position:absolute;top:-4px;bottom:-4px;width:4px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 2px var(--paper);transform:translateX(-50%);transition:left .05s}
.wread{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:13.5px;align-items:center}
.wread b{font:600 11px var(--fb);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* processing */
.scen{display:flex;gap:6px;flex-wrap:wrap}
.lanes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.lane{display:flex;flex-direction:column;gap:0;align-items:stretch}
.ans{align-self:center;font:700 12px var(--fb);padding:3px 10px;border-radius:999px;background:var(--ink);color:var(--paper);margin:4px 0}
.merge{margin-top:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.mini-ss{width:180px;height:auto;display:block}
.beam{transform-box:view-box;transform-origin:90px 34px;transition:transform .9s cubic-bezier(.3,1.5,.5,1)}
.rock{animation:rock 2s ease-in-out infinite}
@keyframes rock{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}

/* mask */
.wants{background:var(--paper);border-radius:16px;padding:14px;box-shadow:inset 0 0 0 1px var(--rule);display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.wants .q{font:600 12px var(--fb);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.wants .r{font-size:18px;font-weight:600;min-height:52px;display:grid;place-items:center}
.two{display:flex;gap:8px;width:100%}.two .btn{flex:1;min-height:44px;font-size:14.5px;padding:0 10px}
.batt{display:flex;align-items:center;gap:10px;margin-top:14px}
.cell{flex:1;height:22px;border-radius:7px;box-shadow:inset 0 0 0 2px var(--ink2);padding:3px;position:relative}
.cell::after{content:"";position:absolute;right:-7px;top:6px;width:4px;height:10px;border-radius:0 2px 2px 0;background:var(--ink2)}
.cell i{display:block;height:100%;border-radius:4px;transition:width .6s ease,background .4s}
.mstat{font:600 13px var(--fb);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.crash{position:absolute;inset:0;background:#7f1d1d;color:#fef2f2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;border-radius:22px;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

/* complete map */
.cmap{display:flex;flex-direction:column;gap:0}
.grp{border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.grp>.gt{font:700 11px var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.grp.in{background:var(--dh-s)}.grp.pr{background:var(--au-s)}.grp.out{background:var(--sheet2)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbox{appearance:none;border:0;cursor:pointer;text-align:left;color:var(--ink);font:400 12.5px/1.3 var(--fb);background:var(--paper);border-radius:12px;padding:8px 10px;box-shadow:inset 0 0 0 1px var(--rule);position:relative;transition:box-shadow .2s,transform .2s}
.mbox b{display:block;font-size:13px;font-weight:600;margin-bottom:2px}
.mbox .pt{position:absolute;top:-8px;right:6px;font:700 10px var(--fb);background:var(--ink);color:var(--paper);border-radius:999px;padding:2px 7px}
.mbox.sel{box-shadow:inset 0 0 0 2.5px var(--dh);transform:translateY(-1px)}
.mbox.wide{grid-column:1/-1;text-align:center}
.mexp{margin-top:12px;font-size:14px;background:var(--paper);border-radius:12px;padding:10px 12px;min-height:44px;box-shadow:inset 0 0 0 1px var(--rule)}

/* quick ref */
.qr{background:var(--paper);border-radius:16px;padding:14px;margin-top:12px;box-shadow:inset 0 0 0 1px var(--rule)}
.qr dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;font-size:14px}
.qr dt{font:600 11px/1.5 var(--fb);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:2px}
.qr dd{margin:0}

/* before you start */
.tbl{overflow-x:auto;border-radius:12px;box-shadow:inset 0 0 0 1px var(--rule);margin-top:8px}
.tbl table{border-collapse:collapse;width:100%;min-width:520px;font-size:13px;line-height:1.4}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--rule)}
.tbl th{background:var(--sheet);font-weight:600}
.tbl tr:last-child td{border-bottom:0}
details.ideas{background:var(--sheet);border-radius:16px;padding:12px 16px}
details.ideas summary{cursor:pointer;font-weight:600}
details.ideas .stack{margin-top:10px}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--sheet);cursor:pointer;font-size:15px}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--dh);flex:none}
.yellow-stage{background:radial-gradient(95% 85% at 35% 25%,#FFE27A,#FFD43B 65%,#F6C62E);color:#2B2140;border-radius:24px;padding:30px 20px;text-align:center}
.yellow-stage .route i{background:#FFE68A}.yellow-stage .route .done i{background:#2B2140;color:#FFD43B}.yellow-stage .route{color:#2B2140}.yellow-stage .route::before{border-color:rgba(43,33,64,.3)}

/* ---------- round 2 additions ---------- */
:root{--bez:#3D3450}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bez:#5F5375}}
:root[data-theme="dark"]{--bez:#5F5375}
.icw{display:inline-flex;width:1em;height:1em;vertical-align:-.14em;flex:none}
.icw svg{width:100%;height:100%;display:block}
h2 .icw{margin-right:3px}
.try{display:flex;gap:8px;align-items:center;font:600 13.5px/1.3 var(--fb);color:var(--dh);background:var(--dh-s);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.try .icw{width:18px;height:18px;animation:tapb 1.4s ease-in-out infinite}
@keyframes tapb{50%{transform:translateY(-2px) rotate(-8deg)}}
.maker{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:14px 16px;border-radius:16px;box-shadow:inset 0 0 0 1.5px var(--rule);font-size:14.5px}
.maker .icw{width:22px;height:22px;margin-top:2px}
.disc li .icw{width:16px;height:16px;margin-top:2px}
.beat .t{display:block;margin-bottom:2px}
.beat .who,.beat .ask,.beat .yn{display:block}
.beat .ask{font-weight:600;font-size:18px;margin:2px 0 4px}
.beat .yn{padding-left:4px}
.beat.rule{border-radius:14px;padding:10px 12px 10px 16px}
.beat.rule.now{background:var(--sheet)}
.beat.rule.now .hl{background-image:none}
.note{background:var(--sheet);border-radius:14px;padding:12px 14px;font-size:15px}
.note .t{display:block}
.note.pink{background:var(--dh-s)}
.screen{max-width:290px;border:7px solid var(--bez);border-bottom-width:9px;border-radius:14px 14px 4px 4px;background:#1C1626;padding:8px}
.screen .ttl{color:#F1EAF7;font:600 11px var(--fb);opacity:.75}
.base{width:100%;max-width:322px;height:13px;background:var(--bez);border-radius:2px 2px 14px 14px;position:relative;box-shadow:none}
.base i{position:absolute;left:50%;top:0;width:48px;height:5px;margin-left:-24px;background:rgba(255,255,255,.2);border-radius:0 0 6px 6px}
.win .wt{display:flex;align-items:center;gap:5px}
.win.closing{transform:scale(.25);opacity:.2;transition:transform .35s,opacity .35s}
.hw{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;margin-top:14px}
.fanbox{display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11px var(--fb);color:var(--muted);white-space:nowrap}
.fan{width:48px;height:48px;display:block}
#fb{transform-box:view-box;transform-origin:22px 22px}
.res{max-width:none;margin-top:0;min-width:0}
.rt{display:block;font:600 11.5px/1.3 var(--fb);color:var(--muted);margin-bottom:6px}
.rl{display:flex;justify-content:space-between;font:600 11.5px var(--fb);margin-top:5px;gap:8px}
.ll{font:500 10.5px var(--fb);color:var(--muted)}
.chip .icw{margin-right:2px}
.cmap .arrow{height:10px}
.grp{padding:8px;gap:6px}
.grp .gt{display:flex;align-items:center;gap:6px}
.mbox{font-size:11.5px;padding:7px 8px}
.mbox b{font-size:12.5px;display:flex;align-items:center;gap:4px;margin-bottom:1px}
.mbox span{display:block}
.mbox .pt{font-size:9px;top:-7px}
.pair.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.mexp{margin-top:10px}
.node .icw{margin-right:2px}

/* ---------- round 3 ---------- */
.journey{background:radial-gradient(95% 85% at 35% 25%,#FFE27A,#FFD43B 65%,#F6C62E);color:#2B2140;border-radius:22px;padding:18px 14px 16px;display:flex;flex-direction:column;gap:12px}
.journey .route,.journey p{color:#2B2140}.journey .route i{background:#FFE68A;color:#2B2140;box-shadow:inset 0 0 0 1.5px #2B2140}.journey .route .now i{background:#C8442A;color:#fff;box-shadow:none}.journey .route::before{border-color:rgba(43,33,64,.3)}.journey .route .now span{color:#2B2140}
.ticks .tk{flex:1;height:14px;border:0;padding:5px 0;background:none;cursor:pointer;position:relative}
.ticks .tk::after{content:"";position:absolute;left:0;right:0;top:5px;height:4px;border-radius:2px;background:var(--rule)}
.ticks .tk.d::after,.ticks .tk.v::after{background:var(--ink2)}.ticks .tk.n::after{background:var(--dh)}
.ticks .tk[disabled]{cursor:default}
.rules{display:flex;flex-direction:column;gap:8px}
.rulec{appearance:none;border:0;cursor:pointer;text-align:left;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;background:var(--paper);color:var(--ink);font:400 14.5px/1.45 var(--fb);padding:12px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--rule);transition:background .2s}
.rulec .t{display:block}
.rulec .tk{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--rule);color:transparent;font-weight:700;font-size:13px;transition:all .25s}
.rulec[aria-pressed="true"]{background:var(--ok-s)}
.rulec[aria-pressed="true"] .tk{background:var(--ok);color:#fff;box-shadow:none;transform:scale(1.08)}
.pcard{background:var(--paper);border-radius:14px;padding:12px 14px;box-shadow:inset 3px 0 0 var(--side)}
.pq{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.pq .ql{font-size:14px}
.popts{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px}
.popt{appearance:none;border:0;cursor:pointer;background:var(--paper);color:var(--ink);font:400 12.5px/1.2 var(--fb);min-height:54px;border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:inset 0 0 0 1px var(--rule);text-align:center}
.popt[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.popts.five .popt{font-size:11px}
@media (max-width:420px){.popt{font-size:11.5px;padding:8px 2px;min-height:58px}}
.lv{display:flex;gap:3px}.lv b{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.25}.lv b.f{opacity:1}
.pres{margin-top:14px;font-size:14px;background:var(--paper);border-radius:12px;padding:12px;box-shadow:inset 0 0 0 1px var(--rule)}
.sbar{height:10px;border-radius:5px;background:var(--rule);overflow:hidden;margin-bottom:8px}.sbar i{display:block;height:100%;transition:width .6s ease}

/* ---------- part 1 ---------- */
.tag{display:inline-flex;align-items:center;gap:6px;font:600 11.5px var(--fb);letter-spacing:.1em;text-transform:uppercase}
.mv{padding:10px 16px;display:flex;justify-content:center}
.mv svg{width:100%;max-width:300px;height:auto;display:block;overflow:visible}
.mv svg *{transform-box:fill-box;transform-origin:center}
.desc{font-size:16.5px}
.desc b{background-image:linear-gradient(var(--mark),var(--mark));background-repeat:no-repeat;background-position:0 88%;background-size:100% 42%}
.scorebox{background:var(--sheet);border-radius:20px;padding:4px 14px 14px}
.nbox{margin-top:12px}.nbox summary{cursor:pointer;color:var(--muted);font-size:14px}
.nbox textarea{width:100%;box-sizing:border-box;margin-top:8px;min-height:70px;border-radius:12px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--fb);padding:10px 12px}
.sect{border-radius:24px;padding:28px 20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.sect.dh{background:var(--dh-s);color:var(--dh)}.sect.ink{background:var(--sheet);color:var(--ink)}
.sect h2,.sect p{color:var(--ink)}
.note.yel{background:rgba(255,212,59,.2)}
.panel{background:var(--sheet);border-radius:20px;padding:18px}
.big{font:600 15px var(--fb)}.big b{font:var(--fw) calc(44px * var(--hs))/1 var(--fd)}
.io2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.io2 b{font-size:20px}
.toprow{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:center;background:var(--sheet);border-radius:14px;padding:12px}
.toprow .rank{font:var(--fw) calc(30px * var(--hs))/1 var(--fd);color:var(--dh);text-align:center}
@keyframes sky{0%,100%{fill:#BFE3F2}35%{fill:#F6B26B}50%,85%{fill:#1E1A3A}95%{fill:#F6B26B}}
@keyframes skyfill{0%,100%{fill:#BFE3F2}35%{fill:#F6B26B}50%,85%{fill:#1E1A3A}95%{fill:#F6B26B}}
@keyframes orbit{from{transform:rotate(-70deg)}to{transform:rotate(290deg)}}
@keyframes stars{0%,40%{opacity:0}50%,85%{opacity:1}95%,100%{opacity:0}}
@keyframes fly{0%{transform:translate(var(--x),var(--y));opacity:0}15%{opacity:1}80%{transform:translate(0,0);opacity:1}100%{transform:translate(0,0);opacity:0}}
@keyframes drain{0%{width:98px}70%{width:6px}100%{width:6px}}
@keyframes ouch{0%,55%{opacity:0}65%,100%{opacity:1}}
@keyframes hit{0%,30%{transform:scale(1)}36%{transform:scale(.7)}46%{transform:scale(1.1)}60%,100%{transform:scale(1)}}
@keyframes wave{0%,30%{opacity:0;transform:scale(.6)}40%{opacity:.8}80%,100%{opacity:0;transform:scale(1.15)}}
@keyframes rush{0%{transform:translateX(0)}45%,70%{transform:translateX(118px)}100%{transform:translateX(0)}}
@keyframes fade{0%{opacity:1;filter:none}80%{opacity:.15;filter:grayscale(1)}100%{opacity:1}}
@keyframes dimx{0%,100%{opacity:.25}50%{opacity:.45}}
@keyframes knob{0%{transform:rotate(-60deg)}60%,100%{transform:rotate(120deg)}}
@keyframes pump{0%,30%{opacity:.2}50%,90%{opacity:1}100%{opacity:.2}}
@keyframes nudge{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}30%{transform:translateX(3px)}40%{transform:translateX(-2px)}50%{transform:none}}
@keyframes vanish{0%,40%{opacity:1}55%,90%{opacity:0}100%{opacity:1}}
@keyframes appear{0%,35%{opacity:0;transform:scale(.4)}45%,90%{opacity:1;transform:scale(1)}100%{opacity:0}}
@keyframes pop{0%,10%{transform:scale(.6);opacity:0}20%,70%{transform:scale(1);opacity:1}85%,100%{opacity:0}}
@keyframes count{0%,15%{opacity:0}20%,35%{opacity:1}40%,100%{opacity:0}}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-10px)}}
@keyframes drawL2{0%{stroke-dashoffset:1}70%,100%{stroke-dashoffset:0}}

function buildLogo(){

  const fs=parseFloat(getComputedStyle(au).fontSize), h=fs*.7, sw=fs*.14, pad=sw;
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const wob=(pts,a)=>pts.map(([x,y],i)=>[x+(i&&i<pts.length-1?(rnd()-.5)*a:0),y+(i&&i<pts.length-1?(rnd()-.5)*a:0)]);
  const smooth=pts=>{let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;for(let i=1;i<pts.length-1;i++){const xc=(pts[i][0]+pts[i+1][0])/2,yc=(pts[i][1]+pts[i+1][1])/2;d+=` Q${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)} ${xc.toFixed(1)} ${yc.toFixed(1)}`}const E=pts[pts.length-1];return d+` L${E[0].toFixed(1)} ${E[1].toFixed(1)}`};

  dots.setAttribute("width",auW+dW+r*4);dots.setAttribute("height",r*10);dots.innerHTML=ds;

function throwable(el){
  const rot0=+el.dataset.rot, dy0=+el.dataset.dy;
  let x=0,y=0,vx=0,vy=0,spin=0,raf=0,drag=false,lx=0,ly=0,lt=0,sx=0,sy=0;
  const set=()=>{el.style.transform=`translate(${x}px,${y+dy0}px) rotate(${rot0+spin}deg)`};
  el.addEventListener("pointerdown",e=>{e.preventDefault();cancelAnimationFrame(raf);drag=true;el.setPointerCapture(e.pointerId);sx=e.clientX-x;sy=e.clientY-y;lx=e.clientX;ly=e.clientY;lt=performance.now();el.style.zIndex=5});
  el.addEventListener("pointermove",e=>{if(!drag)return;const t=performance.now(),dt=Math.max(1,t-lt);vx=(e.clientX-lx)/dt*16;vy=(e.clientY-ly)/dt*16;lx=e.clientX;ly=e.clientY;lt=t;x=e.clientX-sx;y=e.clientY-sy;spin=x*.12;set()});
  const up=()=>{if(!drag)return;drag=false;let flying=true,ft=0;
    const step=()=>{ft++;
      if(flying){x+=vx;y+=vy;vy+=.6;vx*=.97;spin+=vx*.9;if(ft>22||(Math.abs(vx)<1&&Math.abs(vy)<1))flying=false;}
      else{const k=.08,c=.78;vx=(vx-x*k)*c;vy=(vy-y*k)*c;x+=vx;y+=vy;spin*=.86;}
      set();
      if(!flying&&Math.abs(x)<.3&&Math.abs(y)<.3&&Math.abs(vx)<.3&&Math.abs(vy)<.3&&Math.abs(spin)<.3){x=y=spin=0;set();el.style.zIndex="";return}
      raf=requestAnimationFrame(step)};
    raf=requestAnimationFrame(step)};
  el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
}
/* "Au" moves a little, springs back and shakes no, like a wrong Mac password */
function noAu(el){
  let drag=false,sx=0,sy=0;
  const lim=v=>Math.sign(v)*Math.min(22,Math.abs(v)*.22);
  el.addEventListener("pointerdown",e=>{e.preventDefault();drag=true;el.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;el.classList.remove("shake","intro-done");el.style.transition="none"});
  el.addEventListener("pointermove",e=>{if(!drag)return;el.style.transform=`translate(${lim(e.clientX-sx)}px,${lim(e.clientY-sy)}px)`});
  const up=()=>{if(!drag)return;drag=false;el.style.transition="transform .14s ease-out";el.style.transform="translate(0,0)";
    setTimeout(()=>{el.style.transition="";el.style.transform="";void el.offsetWidth;el.classList.add("shake")},150)};
  el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
  el.addEventListener("animationend",()=>el.classList.remove("shake"));
}

function dotField(){
  const brand=$(".brand"),svg=$("#dots"); if(!brand||!svg) return;
  brand._cs=$$("circle",svg).map(c=>({c,x:+c.getAttribute("cx"),y:+c.getAttribute("cy"),k:+c.dataset.k,ox:0,oy:0,vx:0,vy:0}));
  if(brand._df) return; brand._df=1;
  let px=null,py=null,raf=0;
  const tick=()=>{const r=svg.getBoundingClientRect();let moving=false;
    brand._cs.forEach(d=>{let tx=0,ty=0;
      if(px!==null){const dx=d.x+r.left-px,dy=d.y+r.top-py,dist=Math.hypot(dx,dy),RR=64;if(dist<RR){const f=(1-dist/RR)*34*d.k;tx=dx/(dist||1)*f;ty=dy/(dist||1)*f;}}
      d.vx=(d.vx+(tx-d.ox)*.16)*.74;d.vy=(d.vy+(ty-d.oy)*.16)*.74;d.ox+=d.vx;d.oy+=d.vy;
      if(Math.abs(d.ox)>.05||Math.abs(d.oy)>.05||Math.abs(d.vx)>.05||Math.abs(d.vy)>.05)moving=true;
      d.c.setAttribute("transform",`translate(${d.ox.toFixed(2)} ${d.oy.toFixed(2)})`)});
    raf=(moving||px!==null)?requestAnimationFrame(tick):0};
  const kick=()=>{if(!raf)raf=requestAnimationFrame(tick)};
  brand.addEventListener("pointermove",e=>{px=e.clientX;py=e.clientY;kick()});
  ["pointerleave","pointerup","pointercancel"].forEach(t=>brand.addEventListener(t,()=>{px=null;kick()}));
}

 {id:"filter",side:"dh",st:"Input",lab:"Distracted by Everything",mv:"filter",mo:"You're in a conversation, and a phone buzz, a flickering light and your own hunger all pull at you equally. You lose the thread.",

const DECKS={

const ORDER=["adhd","autism","shared","seesaw","mask","burn"];
function dk(key){S.dk=S.dk||{};if(!S.dk[key]){const n=DECKS[key].cards.length,o=[...Array(n).keys()];if(DECKS[key].shuffle){let seed=(Date.now()%2147483646)+1;for(let i=n-1;i>0;i--){seed=(seed*16807)%2147483647;const j=seed%(i+1);[o[i],o[j]]=[o[j],o[i]]}}S.dk[key]={step:"intro",i:0,order:o,a:{}}}return S.dk[key]}
const qDone=(q,a)=>(q.cond&&!q.cond(a))||a[q.k]!==undefined||(q.dep&&a.dep);
const done=(D,c,a)=>!!a&&D.qs(c).every(q=>qDone(q,a));

  const lv=(o,i)=>`<span class="lv">${o.map((_,d)=>`<b class="${d<=i?"f":""}"></b>`).join("")}</span>`;

  if(q.t==="scale"){const depOn=q.dep&&(a.depOpen||a.dep);
    return wrap(`<span class="ql"><b>${q.label}</b></span><div class="${q.opts.length===5?"scale5":"scale4"}" role="group" aria-label="${q.label}">${q.opts.map((o,i)=>`<button class="s5 ${a[q.k]===i?"on":""}" data-k="${q.k}" data-v="${i}" aria-pressed="${a[q.k]===i}">${lv(q.opts,i)}${o}</button>`).join("")}</div>
     ${q.dep?(depOn?`<div class="depbox"><span class="ql"><b>It depends on…</b> pick any</span><div class="chiprow">${DEPS.map(d=>`<button class="chip dp" aria-pressed="${(a.dep||[]).includes(d)}">${d}</button>`).join("")}</div></div>`:`<button class="dep" id="dep">It depends…</button>`):""}`)}
  if(q.t==="multi"){const sel=a[q.k]||[],none=a._none&&a._none[q.k];
    return wrap(`<span class="ql"><b>${q.label}</b> <span class="muted">${q.sub||""}</span></span><div class="chiprow">${q.opts.map(o=>`<button class="chip mu" data-k="${q.k}" aria-pressed="${sel.includes(o)}">${o}</button>`).join("")}${q.none?`<button class="chip mun" data-k="${q.k}" aria-pressed="${!!none}">${q.none}</button>`:""}</div>`)}

  if(q.t==="dir"){const L=[`${c.l} wins`,`Mostly ${c.l.toLowerCase()}`,"Keeps flipping",`Mostly ${c.r.toLowerCase()}`,`${c.r} wins`];

  return "";
}

  const y=scrollY;
  app.innerHTML=`${topbar(`<button class="textbtn" id="home" style="text-decoration:none;font-weight:600">← Map</button><span class="ticks">${ticks}</span>`)}<section class="stack g16 deck" style="padding-top:8px;--pa:${PA[key]}">${body}
   <div class="navrow"><button class="btn ghost" id="prev" style="flex:0 0 auto;padding:0 18px" aria-label="Previous">←</button><button class="btn" id="next" ${canNext?"":"disabled"}>${nextTxt}</button></div>${st.step==="card"&&!canNext?`<button class="textbtn" id="skipc" style="align-self:center">Skip this card for now</button>`:""}</section>`;
  if(still) scrollTo(0,y);
  wireTop();
  $("#home").onclick=()=>{S.view="welcome";save();render();scrollTo(0,0)};
  const re=()=>{save();renderDeck(key)};const reStill=()=>{S._still=1;re()};
  const ki=ORDER.indexOf(key);
  const leave=()=>{const nx=ORDER[ki+1];S.view=nx?"deck:"+nx:"results";if(!nx)chime();save();render();scrollTo(0,0)};
  const advance=()=>{if(st.i<N-1){st.i++;re()}else{const s=after();if(s==="leave"){leave();return}st.step=s;re()}scrollTo(0,0)};
  $$(".ticks .tk").forEach(b=>b.onclick=()=>{st.step="card";st.i=+b.dataset.n;re();scrollTo(0,0)});
  if($("#skipc")) $("#skipc").onclick=advance;
  $("#prev").onclick=()=>{if(st.step==="intro"){if(ki>0){S.view="deck:"+ORDER[ki-1];save();render()}else{S.view="done";save();render()}}
    else if(st.step==="card"){if(st.i>0)st.i--;else st.step="intro";re()}
    else if(st.step==="end"){st.step="card";st.i=N-1;re()}
    else{st.step=D.end?"end":"card";if(!D.end)st.i=N-1;re()}scrollTo(0,0)};
  $("#next").onclick=()=>{if(st.step==="intro"){st.step="card";st.i=0;re();scrollTo(0,0)}else if(st.step==="card")advance();else if(st.step==="end"){st.step="mini";re();scrollTo(0,0)}else leave()};
  if(st.step==="end") $$(".en").forEach(b=>b.onclick=()=>{st.end=+b.dataset.v;tap();reStill()});
  if(st.step==="card"){const c=cur,a=curA;
    const prune=()=>{D.qs(c).forEach(q=>{if(q.cond&&!q.cond(a))delete a[q.k]})};
    const after2=(lastT)=>{prune();const was=a.rev;if(done(D,c,a)){if(D.reveal&&!was){a.rev=1;a.revNew=1}
        if(!D.reveal&&lastT!=="multi"){reStill();setTimeout(()=>{if(S.view==="deck:"+key&&st.step==="card"&&st.order[st.i]===D.cards.indexOf(c))advance()},420);return}}
      reStill()};
    $$(".s5[data-k]").forEach(b=>b.onclick=()=>{a[b.dataset.k]=+b.dataset.v;if(b.dataset.k==="v")delete a.dep,delete a.depOpen;tap();after2("scale")});
    $$(".s5.dr").forEach(b=>b.onclick=()=>{a.dir=+b.dataset.v;tap();after2("dir")});
    $$(".ch1").forEach(b=>b.onclick=()=>{a[b.dataset.k]=+b.dataset.v;tap();after2("chips")});
    $$(".mu").forEach(b=>b.onclick=()=>{const k=b.dataset.k,o=b.textContent;const s=a[k]||[];const ns=s.includes(o)?s.filter(x=>x!==o):[...s,o];a._none=a._none||{};a._none[k]=0;if(ns.length)a[k]=ns;else delete a[k];tap();after2("multi")});
    $$(".mun").forEach(b=>b.onclick=()=>{const k=b.dataset.k;a._none=a._none||{};a._none[k]=1;a[k]=[];tap();after2("multi")});
    if($("#dep")) $("#dep").onclick=()=>{a.depOpen=1;reStill()};
    $$(".dp").forEach(b=>b.onclick=()=>{const d=b.textContent;const s=a.dep||[];const ns=s.includes(d)?s.filter(x=>x!==d):[...s,d];if(ns.length){a.dep=ns;delete a.v}else delete a.dep;tap();after2("multi")});
  }
  if(!still){const h=$("#st");h&&h.focus({preventScroll:true})}
}

/* ================= SCORING ================= */
const fq=a=>!a?null:a.dep?2:a.v!==undefined?a.v:null;
const avg=xs=>{const v=xs.filter(x=>x!==null&&x!==undefined);return v.length?v.reduce((p,q)=>p+q,0)/v.length:0};
const HI=.5, CF=.45; /* first guesses, tuned with real answers later */
function scores(){
  const A=dk("adhd"),U=dk("autism"),SH=dk("shared"),SS=dk("seesaw"),M=dk("mask"),B=dk("burn");
  const ans=c=>(c.side==="dh"?A:c.side==="au"?U:SH).a[c.id];
  const side=s=>TRAITS.filter(c=>c.side===s);
  const lvl=s=>avg(side(s).map(c=>fq(ans(c))))/4;
  const adhd=lvl("dh"),aut=lvl("au"),both=lvl("both");
  const strong=s=>side(s).filter(c=>strongA(ans(c)));
  const strongAll=TRAITS.filter(c=>strongA(ans(c)));
  const hidden=strongAll.filter(c=>{const a=ans(c);return a.hide===0||a.hide===1});
  const areaCount=AREAS3.map(x=>[x,TRAITS.filter(c=>(ans(c)?.areas||[]).includes(x)).length]);
  const conflict=avg(SEESAW.map(c=>SS.a[c.id]?.r))/3;
  const felt=SEESAW.filter(c=>SS.a[c.id]?.r>=2);
  const distress=avg(SEESAW.map(c=>{const a=SS.a[c.id];return a&&a.r>=1?a.s:null}))/3;
  const dirs=SEESAW.map(c=>SS.a[c.id]?.dir).filter(x=>x!==undefined);
  const swings=dirs.filter(d=>d===2).length,dirMean=dirs.length?avg(dirs):2;
  const maskB=avg(MASK.map(c=>{const a=M.a[c.id];if(!a||a.v===undefined)return null;return a.v===0?0:(a.v/4)*(((a.d??0)+1)/4)}));
  const hideShare=strongAll.length?hidden.length/strongAll.length:0;
  const mask=Math.min(1,maskB*.75+hideShare*.25);
  const ctx=CTX.map(x=>[x,MASK.filter(c=>(M.a[c.id]?.ctx||[]).includes(x)).length]).filter(x=>x[1]>0).sort((p,q)=>q[1]-p[1]);
  const burn=avg(BURN.map(c=>{const a=B.a[c.id];if(!a||a.p===undefined)return null;return (a.p/3)*(a.p?[.7,.85,1,1][a.t??0]:1)}));
  const flags=BURN.filter(c=>B.a[c.id]?.p>=2).map(c=>c.lab);
  const hiA=adhd>=HI,hiU=aut>=HI,hiC=conflict>=CF;
  const res=hiA&&hiU?(hiC?"audhd":"both"):hiA?"adhd":hiU?"aut":"none";
  const hiding=res!=="audhd"&&res!=="both"&&hiC;
  const near=Math.abs(adhd-HI)<.06||Math.abs(aut-HI)<.06||(hiA&&hiU&&Math.abs(conflict-CF)<.06);
  let lean=null;if(res==="audhd"){if(swings>=3)lean="var";else if(adhd-aut>=.12)lean="dh";else if(aut-adhd>=.12)lean="au";else lean=dirMean>2.4?"dh":dirMean<1.6?"au":"var"}
  const care=burn>=.6||strongA(U.a.melt)&&U.a.melt.v===4||BURN.some(c=>B.a[c.id]?.p===3);
  return {adhd,aut,both,conflict,distress,felt,swings,mask,burn,flags,ctx,res,hiding,near,lean,care,
   strongDh:strong("dh"),strongAu:strong("au"),strongBoth:strong("both"),hidden,areaCount,childA:A.end,childU:U.end};
}

/* ================= MINI RESULTS (after each part) ================= */
const word=x=>x>=.6?"Strong":x>=.35?"Some":"Low";
const barRow=(l,v,col)=>`<div class="rrow"><span>${l}</span><div class="sbar"><i style="width:${Math.max(3,Math.round(v*100))}%;background:${col}"></i></div><b>${word(v)}</b></div>`;
const dotRow=(cards,ansOf,col)=>`<div class="dots">${cards.map(c=>{const a=ansOf(c);const on=strongA(a);return `<span class="dt ${on?"on":fq(a)>=2?"half":""}" style="--c:${col}" title="${c.lab}"></span>`}).join("")}</div>`;
const stage=(n,h,r)=>`<div class="yellow-stage stack g12"><span class="eyebrow" style="color:#2B2140;opacity:.7">Part ${n} complete</span><h2 style="color:#2B2140">${h}</h2>${route(r)}</div>`;
function miniHTML(key){
  const s=scores();
  if(key==="adhd"||key==="autism"){const dh=key==="adhd",side=dh?"dh":"au",st=dk(key),cards=TRAITS.filter(c=>c.side===side),strong=dh?s.strongDh:s.strongAu,col=dh?"var(--dh)":"var(--au)";
    const hid=strong.filter(c=>s.hidden.includes(c)).length;
    return `${stage(dh?1:2,dh?"Your ADHD side is mapped.":"Your autism side is mapped.",dh?2:3)}
     <div class="panel stack g10"><span class="eyebrow">${dh?"ADHD":"Autism"} traits that show up weekly or more</span>${dotRow(cards,c=>st.a[c.id],col)}
      <p><b>${strong.length} of ${cards.length}</b>${strong.length?`: ${strong.map(c=>c.lab).join(", ")}.`:"."}</p>
      ${strong.length?`<p class="small">You hide <b>${hid}</b> of them from people, at least sometimes.</p>`:""}
      <p class="small muted">Full dot: weekly, daily or "it depends". Half dot: monthly.</p></div>
     ${dh?"":circleMap("s1")}
     <p class="muted">${dh?"Next: Part 2, your autism side.":"Next: Part 3, where the two sides meet."}</p>`;}
  if(key==="seesaw"){const SS=dk("seesaw");
    return `${stage(3,"Your seesaw is mapped.",4)}
     <div class="panel">${SEESAW.map(c=>{const a=SS.a[c.id]||{};return `<div class="ssrow"><span class="l">${c.l}</span>${ssBeam(a.dir,"","",0)}<span class="r">${c.r}</span></div>`}).join("")}</div>
     <p><b>${s.felt.length} of 7</b> pulls you feel often or constantly.</p>
     <p class="small muted">Beams tip toward the side that wins lately. Rocking beams keep flipping. Flat, still beams are pulls you rarely feel.</p>
     <p class="muted">Next: masking and burnout. What all of this costs you.</p>`;}
  if(key==="mask") return `<div class="panel stack g10"><span class="eyebrow">Masking load</span>${barRow("Masking",s.mask,"var(--au)")}<p class="small muted">How often you mask, how much it drains you, and how many of your strong traits you hide.</p>${s.ctx.length?`<p class="small">You mask most at: <b>${s.ctx.slice(0,2).map(x=>x[0]).join(" and ")}</b>.</p>`:""}</div><p>One more short deck: burnout signals.</p>`;
  if(key==="burn") return `${stage(4,"Your costs are mapped.",5)}
     <div class="panel stack g10">${barRow("Masking",s.mask,"var(--au)")}${barRow("Burnout",s.burn,"var(--dh)")}</div>
     ${s.flags.length?`<div class="note pink">${T("Your red flags right now",s.flags.slice(0,5).join(" · "))}</div>`:""}
     <p class="muted">Everything is in. Time to see your map.</p>`;
  return "";
}

/* ================= FINAL RESULTS ================= */
const RES={
 adhd:{icon:`${ic("bolt","var(--dh)")}`,name:"ADHD-leading",line:"Your ADHD side shows up strongly. Your autism side shows up less.",
  body:"Your answers look most like ADHD on its own. Some autistic traits may still be part of you, just quieter."},
 aut:{icon:`${ic("inf","var(--au)")}`,name:"Autism-leading",line:"Your autism side shows up strongly. Your ADHD side shows up less.",
  body:"Your answers look most like autism on its own. Some ADHD traits may still be part of you, just quieter."},
 both:{icon:`${ic("bolt","var(--dh)")}${ic("inf","var(--au)")}`,name:"Both, but separate",line:"Both sides show up strongly, and they rarely fight.",
  body:"Your answers show strong ADHD and strong autism traits, with little tug-of-war between them. The two seem to live side by side."},
 audhd:{icon:`${ic("seesaw")}`,name:"The AuDHD experience",line:"Both sides show up strongly, and they pull against each other.",

function radarN(vals,labels,cols){const n=vals.length,R=92,c=120,p=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [c+Math.cos(a)*R*r,c+Math.sin(a)*R*r]};
  const ring=s=>[...Array(n).keys()].map(i=>p(i,s).join(",")).join(" ");
  return `<svg class="radar6" viewBox="-34 -6 308 252" role="img" aria-label="Your shape: ${labels.map((l,i)=>l+" "+word(vals[i]).toLowerCase()).join(", ")}">${[.25,.5,.75,1].map(s=>`<polygon points="${ring(s)}" fill="none" stroke="var(--rule)"/>`).join("")}
   ${[...Array(n).keys()].map(i=>{const [x,y]=p(i,1);return `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="var(--rule)"/>`}).join("")}
   <polygon class="rpoly" points="${vals.map((v,i)=>p(i,Math.max(.05,v)).join(",")).join(" ")}" fill="var(--dh)" fill-opacity=".18" stroke="var(--dh)" stroke-width="2.5" stroke-linejoin="round"/>
   ${vals.map((v,i)=>{const [x,y]=p(i,Math.max(.05,v));return `<circle cx="${x}" cy="${y}" r="4.5" fill="${cols[i]}"/>`}).join("")}
   ${labels.map((l,i)=>{const [x,y]=p(i,1.18);return `<text x="${x}" y="${y+4}" text-anchor="${Math.abs(x-c)<6?"middle":x>c?"start":"end"}" font-size="11" font-family="Lexend" font-weight="600" fill="${cols[i]}">${l}</text>`}).join("")}</svg>`}
function quad(s){const W=260,P=34,G=W-P*2,X=v=>P+v*G,Y=v=>W-P-v*G,cut=HI;
  const lab=(x,y,t,on)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="11" font-family="Lexend" font-weight="${on?700:500}" fill="${on?"var(--ink)":"var(--muted)"}">${t}</text>`;
  const on=k=>s.res===k||(k==="both"&&s.res==="audhd");
  return `<svg class="quad" viewBox="0 0 ${W} ${W}" role="img" aria-label="Where you land: ADHD ${word(s.adhd).toLowerCase()}, autism ${word(s.aut).toLowerCase()}">
   <rect x="${P}" y="${P}" width="${G}" height="${G}" rx="12" fill="var(--sheet)"/>
   <rect x="${X(cut)}" y="${P}" width="${G*(1-cut)}" height="${G*(1-cut)}" fill="${s.res==="audhd"?"#FFD43B":"var(--sheet2)"}" opacity="${s.res==="audhd"?.55:1}"/>
   <line x1="${X(cut)}" y1="${P}" x2="${X(cut)}" y2="${W-P}" stroke="var(--rule)" stroke-dasharray="4 4"/><line x1="${P}" y1="${Y(cut)}" x2="${W-P}" y2="${Y(cut)}" stroke="var(--rule)" stroke-dasharray="4 4"/>
   ${lab(X(cut+(1-cut)/2),P+18,s.res==="audhd"?"AuDHD":"Both",on("both"))}${lab(X(cut/2),P+18,"Autism-leading",on("aut"))}
   ${lab(X(cut+(1-cut)/2),W-P-10,"ADHD-leading",on("adhd"))}${lab(X(cut/2),W-P-10,"Neither strongly",on("none"))}
   <text x="${W/2}" y="${W-8}" text-anchor="middle" font-size="11" font-family="Lexend" font-weight="600" fill="var(--dh)">ADHD side →</text>
   <text x="12" y="${W/2}" text-anchor="middle" font-size="11" font-family="Lexend" font-weight="600" fill="var(--au)" transform="rotate(-90 12 ${W/2})">Autism side →</text>
   <circle cx="${X(s.adhd)}" cy="${Y(s.aut)}" r="16" fill="var(--dh)" opacity=".18" class="qpulse"/><circle cx="${X(s.adhd)}" cy="${Y(s.aut)}" r="8" fill="var(--dh)" stroke="var(--paper)" stroke-width="2.5"/>
   <text x="${X(s.adhd)>W-80?X(s.adhd)-14:X(s.adhd)+14}" y="${Y(s.aut)+4}" text-anchor="${X(s.adhd)>W-80?"end":"start"}" font-size="11" font-family="Lexend" font-weight="700" fill="var(--ink)">you</text></svg>`}
function renderResults(){
  const s=scores(),R=RES[s.res];
  const chips=xs=>`<div class="chiprow">${xs.map(c=>`<span class="chip static">${c}</span>`).join("")}</div>`;
  const kidNow=[s.childA,s.childU].filter(x=>x!==undefined);
  const recent=kidNow.length&&kidNow.every(x=>x===2), lifelong=kidNow.some(x=>x===0);
  app.innerHTML=`${topbar(`<button class="textbtn" id="home" style="text-decoration:none;font-weight:600">← Map</button>`)}<section class="stack g24" style="padding-top:8px">

    <p style="color:#2B2140;margin:0">Your answers look most like</p>
    <h1 style="color:#2B2140;margin:0" tabindex="-1" id="st"><span class="resic">${R.icon}</span> ${R.name}</h1>
    <p style="color:#2B2140"><b>${R.line}</b></p>
    ${s.lean?`<div class="leanbox"><span class="eyebrow" style="color:#2B2140;opacity:.7">Your kind of AuDHD</span><b>${LEAN[s.lean][0]}</b><span class="small">${LEAN[s.lean][1]}</span></div>`:""}</div>
   <p>${R.body}</p>
   ${s.hiding?`<div class="note yel">${T("One side may be hiding the other.","You feel the seesaw pull strongly, even though one side scored lower. ADHD and autism are known to mask each other, so the quieter side may be bigger than it looks. Worth a closer look.")}</div>`:""}
   ${s.near?`<div class="note">${T("You're close to the line.","Some of your scores sit near the edge between two results. Read the neighbouring result too, and trust what fits.")}</div>`:""}

   <div class="stack g12"><h2>Where you land</h2><p class="small muted">Across: your ADHD side. Up: your autism side. Top right means both are strong. Then the seesaw decides: if they pull against each other, that's AuDHD.</p>${quad(s)}</div>

   <div class="stack g12"><h2>Your shape</h2><p class="small muted">A spiky shape is normal for us.</p>

    <div class="panel stack g8">${barRow(ic("bolt")+" ADHD",s.adhd,"var(--dh)")}${barRow(ic("inf")+" Autism",s.aut,"var(--au)")}${barRow(ic("seesaw")+" Seesaw",s.conflict,"var(--ink)")}${barRow(ic("mask")+" Masking",s.mask,"var(--au)")}${barRow("Burnout",s.burn,"var(--dh)")}</div></div>

    <p>You feel <b>${s.felt.length} of 7</b> seesaw pulls often or constantly${s.felt.length?`: ${s.felt.map(c=>c.lab.toLowerCase()).join(", ")}`:""}.</p>
    ${s.felt.length?`<p class="small muted">On average, the pulls bother you: <b>${["very little","a little","quite a lot","a lot"][Math.min(3,Math.round(s.distress*3))]}</b>.</p>`:""}</div>

   <div class="stack g12"><h2>What you hide</h2>
    ${s.hidden.length?`<p>Strong traits you hide from people, at least sometimes:</p>${chips(s.hidden.map(c=>c.lab))}`:`<p class="muted">You didn't mark any strong traits as hidden.</p>`}
    ${s.ctx.length?`<p>You mask most at: <b>${s.ctx.slice(0,3).map(x=>x[0]).join(", ")}</b>.</p>`:""}

   <div class="stack g12"><h2>Burnout signals</h2>${barRow("Burnout",s.burn,"var(--dh)")}
    ${s.flags.length?`<p>Your red flags right now:</p>${chips(s.flags.slice(0,6))}`:`<p class="muted">No strong red flags right now.</p>`}
    ${s.care?`<div class="note yel">${T("Go gently.","Some of your answers show things are heavy right now. If it ever feels like too much, please talk to someone you trust or a local support line. You don't have to wait until it gets worse.")}</div>`:""}</div>

   ${recent?`<div class="note">${T("Most of this started recently.","ADHD and autism are lifelong, so they usually show up in childhood. If most of yours started in the last few years, stress or burnout may be a big part of the picture. Worth exploring with a professional.")}</div>`:lifelong?`<div class="note">${T("These have been with you for a long time.","That fits: ADHD and autism are both lifelong.")}</div>`:""}

    <div class="offer on"><span class="you-badge">Part 6</span><b>Pick your main quest</b><span class="small muted">You know your shape. Now pick the one area of life to work on first, and how many spoons it gets. About 5 minutes.</span><button class="btn" id="toSeason" style="min-height:46px">Pick my main quest →</button></div></div>

   <div class="note pink">${T("This comes before a diagnosis.","It's a pre-diagnosis map, built from 30 years of lived experience and checked against published research. Your answers <i>look like</i> a pattern. Only a qualified clinician can diagnose ADHD or autism.")}</div>
   <button class="btn ghost" id="redo">← Review my answers</button><button class="textbtn" id="restart" style="align-self:center">Start the whole Map again</button></section>`;
  wireTop();$("#home").onclick=()=>{S.view="welcome";save();render()};
  $("#redo").onclick=()=>{S.view="deck:adhd";const st=dk("adhd");st.step="card";st.i=0;save();render();scrollTo(0,0)};
  $("#restart").onclick=()=>{delete S.dk;S.view="deck:adhd";save();render();scrollTo(0,0)};
  $("#toSeason").onclick=()=>{S.view="season";save();render();scrollTo(0,0)};
  $("#toDoc").onclick=()=>{S.docFrom="results";S.view="doctor";save();render();scrollTo(0,0)};
  const h=$("#st");h&&h.focus({preventScroll:true});
}



/* ================= THE AuDHD CIRCLE (start, between steps, and the end) =================
   Centre: the dream outcome. Pink: the problem. Green: how. Gold: who you become. 9 steps outside. */
const CM_CX=560,CM_CY=520,CM_VB=[-110,-20,1340,1150];

/* ================= SOUND (generated, off by default) ================= */
let AC=null,amb=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function blip(f1,f2,dur,vol){if(!S.sfx)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.setValueAtTime(f1,a.currentTime);o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+dur);g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+dur)}
function tap(){}
function chime(){blip(660,990,.35,.07);setTimeout(()=>blip(880,1320,.4,.05),120)}
function noiseBuf(a,type){const len=a.sampleRate*3,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;if(type==="brown"){last=(last+.02*w)/1.02;d[i]=last*3.5}else d[i]=w}return b}
function setAmb(kind){const a=ac();if(amb){amb.forEach(n=>{try{n.stop()}catch(e){}});amb=null}S.amb=kind;save();if(!kind||!a)return;a.resume&&a.resume();
  const src=a.createBufferSource();src.buffer=noiseBuf(a,kind==="brown"?"brown":"white");src.loop=true;const g=a.createGain();g.gain.value=kind==="brown"?.35:.06;
  const f=a.createBiquadFilter();f.type=kind==="rain"?"bandpass":kind==="cafe"?"lowpass":"lowpass";f.frequency.value=kind==="rain"?1800:kind==="cafe"?700:500;f.Q.value=kind==="rain"?.4:.7;
  src.connect(f).connect(g).connect(a.destination);src.start();amb=[src];
  if(kind==="rain"){const drops=()=>{if(S.amb!=="rain")return;const o=a.createOscillator(),gg=a.createGain();o.frequency.value=1800+Math.random()*2200;gg.gain.setValueAtTime(.012,a.currentTime);gg.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.05);o.connect(gg).connect(a.destination);o.start();o.stop(a.currentTime+.06);setTimeout(drops,30+Math.random()*90)};drops()}}



/* colour the words ADHD / autism / AuDHD wherever they appear in reading text */
const KW=/\b(AuDHD|ADHD|[Aa]utis(?:m|tic))\b/;
function colorize(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){if(!KW.test(n.nodeValue))return 2;const p=n.parentElement;if(!p||p.closest(".cm,svg,button,input,textarea,label,.kw,.eyebrow,.tag,.ticks,.top,.bub,.stg,.vb,.ptitle,.chip,.s5,.rrow,.flip,.prow,.stp,.yellow-stage,.who,[data-nocol]"))return 2;return 1}});
  const ns=[];while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(n=>{const f=document.createDocumentFragment();n.nodeValue.split(/\b(AuDHD|ADHD|[Aa]utis(?:m|tic))\b/).forEach((s,i)=>{if(i%2===0){if(s)f.append(s);return}const sp=document.createElement("span");sp.className="kw";
    if(s==="AuDHD")sp.innerHTML='<span class="kau">Au</span><span class="kdh">DHD</span>';else{sp.classList.add(s==="ADHD"?"dh":"au");sp.textContent=s}f.append(sp)});n.replaceWith(f)})}
let _cz=0;new MutationObserver(()=>{if(_cz)return;_cz=requestAnimationFrame(()=>{_cz=0;colorize(app)})}).observe(app,{childList:true,subtree:true});
function render(){ closeSheet(); paperLayer(); if(LEAD&&S.view!=="welcome"&&S.view!=="p0"&&S.view!=="done"){S.view="welcome"} if(LEAD&&S.view==="p0"&&!S.email){S.view="welcome"} if(S.view&&S.view.startsWith("deck:")){if(!DECKS[S.view.slice(5)]){S.view="deck:adhd";delete S.dk}return renderDeck(S.view.slice(5))} if(S.view==="results") return renderResults(); if(S.view==="season") return renderSeason(); if(S.view==="here") return renderHere(); if(S.view==="doctor") return renderDoctor(); if(S.view==="p1"||S.view==="p2soon"||S.view==="dest"){S.view="deck:adhd";return render()} if(S.view==="p0") renderP0(); else if(S.view==="done") renderDone(); else renderWelcome(); }
render();
})();
